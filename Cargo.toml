[workspace]
resolver = "2"
members = [
    "crates/storage",
    "crates/views",
    "crates/reactive",
    "crates/consensus",
    "crates/compute",
    "crates/router",
    "crates/memory",
    "crates/mitm",
    "crates/rag",
    "crates/protocol",
    "crates/server",
    "crates/bench",
    "crates/demos",
    "crates/gpu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["DB-Strike"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
# Benchmarks are produced on Ryzen 7 7700 (Zen 4, AVX2) with
# `target-cpu=native` so the AVX2 int8 dot-product is actually
# emitted. See .cargo/config.toml for the rustflags.
